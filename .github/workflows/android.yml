name: Build Android APK

on:
  push:
    branches:
      - main  # 或 master，當推送程式碼到此分支時觸發
  pull_request:
    branches:
      - main
  workflow_dispatch: # 允許在 GitHub 網頁上「手動觸發」編譯

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 JDK 17 (依專案版本調整，如 11 或 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '20'
          cache: 'gradle'

      - name: 給予 gradlew 執行權限
        run: chmod +x gradlew

      - name: 使用 Gradle 編譯 Debug APK
        run: ./gradlew assembleDebug

      - name: 上傳 APK 產物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
